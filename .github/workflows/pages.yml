name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Define SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in the repository Variables."
            exit 1
          fi

          mkdir -p _site
          cp index.html hero.jpeg 1e.mp4 _site/
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            url: process.env.SUPABASE_URL,
            publishableKey: process.env.SUPABASE_PUBLISHABLE_KEY,
          };
          fs.writeFileSync(
            '_site/supabase-config.js',
            `window.SUPABASE_CONFIG = ${JSON.stringify(config)};\n`,
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
